services:
  web:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: $DOCKER_REGISTRY/oma:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: for_docker/oma/Dockerfile
      secrets:
        - labgit
        - TOKEN
    command: uwsgi --http-socket 0.0.0.0:8000 --master --buffer-size 8192 --processes ${WSGI_PROCESSES:-3} --module pybrowser_dev.wsgi --vacuum --max-requests=500 --harakiri 60 --listen 512
    environment:
      - CONTAINER_ROLE=web
      - AUTO_INIT=true
      - DJANGO_VITE_DEV_MODE=false
    env_file:
      - env
    volumes:
      # uncomment the following line if you want to use transparently the current checkout mounted
      # into your docker image. convenient for development, but not encouraged in production
      # - ..:/usr/src/pyomabrowser
      - static_volume:${DARWIN_BROWSERSTATIC_PATH}
      - media_volume:${DARWIN_BROWSERMEDIA_PATH}
      - ${RELEASE_PATH_HOST}:${RELEASE_PATH}:ro
    ports:
      - 8000
    depends_on:
      - broker
      - db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/oma/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/
    environment:
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: ${SQL_DATABASE}
    shm_size: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER} -d ${SQL_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: rabbitmq:3
    env_file:
      - env
    ports:
      - 5672:5672
    healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 5s
        timeout: 5s
        retries: 5

  worker:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: $DOCKER_REGISTRY/oma:${IMAGE_TAG:-latest}
    command: ["celery", "--app=pybrowser_dev.celery_app", "worker", "--concurrency=1",
              "--queues=celery,async_web", "--hostname=worker@%h", "--loglevel=INFO"]
    environment:
      - CONTAINER_ROLE=worker
    env_file:
      - env
    volumes:
      - static_volume:${DARWIN_BROWSERSTATIC_PATH}
      - media_volume:${DARWIN_BROWSERMEDIA_PATH}
      - ${RELEASE_PATH_HOST}:${RELEASE_PATH}:ro
    depends_on:
      - broker
      - db

  profiler_worker:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: $DOCKER_REGISTRY/oma:${IMAGE_TAG:-latest}
    command: ["celery", "--app=pybrowser_dev.celery_app", "worker", "--concurrency=1",
              "--queues=profiler", "--hostname=profiler@%h", "--loglevel=INFO"]
    environment:
      - CONTAINER_ROLE=worker
    env_file:
      - env
    volumes:
      - static_volume:${DARWIN_BROWSERSTATIC_PATH}
      - media_volume:${DARWIN_BROWSERMEDIA_PATH}
      - ${RELEASE_PATH_HOST}:${RELEASE_PATH}:ro
    depends_on:
      - broker
      - db

  worker_long:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: $DOCKER_REGISTRY/oma:${IMAGE_TAG:-latest}
    command: ["celery", "--app=pybrowser_dev.celery_app", "worker", "--concurrency=1",
              "--queues=celery,async_web,long", "--hostname=worker@%h", "--loglevel=INFO"]
    environment:
      - CONTAINER_ROLE=worker
    env_file:
      - env
    volumes:
      - static_volume:${DARWIN_BROWSERSTATIC_PATH}
      - media_volume:${DARWIN_BROWSERMEDIA_PATH}
      - ${RELEASE_PATH_HOST}:${RELEASE_PATH}:ro
      - ${ALLALL_PATH_HOST}:${DARWIN_ALLALL_PATH}:ro
    depends_on:
      - broker
      - db

  oauth2-proxy:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.1
    expose:
      - 4180
    volumes:
      - ./oauth2/logo-oma.svg:/oma-logo.svg:ro
    environment:
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=static://200
      - OAUTH2_PROXY_PROVIDER=oidc
      # OMA Browser branding for the sign-in page (shown only on direct browser navigation to /api/)
      - OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO=/oma-logo.svg
      - OAUTH2_PROXY_PROVIDER_DISPLAY_NAME=Keycloak
      - OAUTH2_PROXY_BANNER=Sign in to access the OMA Browser REST API. The data is public; sign-in is only required for direct API access in a browser.
      - OAUTH2_PROXY_FOOTER=<a href="https://omabrowser.org">omabrowser.org</a>
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${OAUTH2_PROXY_OIDC_ISSUER_URL}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_SECURE=${OAUTH2_PROXY_COOKIE_SECURE}
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS=true
      # required: federated IdPs (e.g. Edu-ID) may omit email_verified claim
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_OIDC_AUDIENCES=account
      - OAUTH2_PROXY_REDIRECT_URL=${OAUTH2_PROXY_REDIRECT_URL}

  nginx:
    restart: ${RESTART_CONTAINERS:-unless-stopped}
    image: $DOCKER_REGISTRY/nginx:${IMAGE_TAG:-latest}
    build:
      context: ./nginx
    ports:
      - ${WEBSERVER_PORT:-80}:80
    volumes:
      - static_volume:${DARWIN_BROWSERSTATIC_PATH}
      - media_volume:${DARWIN_BROWSERMEDIA_PATH}
      - ${RELEASE_PATH_HOST}/downloads:${DARWIN_BROWSERDOWNLOAD_PATH}:ro
      - ${NGINX_SNIPPET_PATH_HOST:-./nginx/snippets}:${NGINX_SNIPPET_PATH:-/etc/nginx/snippets}
      - ${NGINX_LOG_PATH_HOST:-./nginx/logs}:/var/log/nginx
    environment:
      - DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE}
      - DARWIN_BROWSERSTATIC_PATH=${DARWIN_BROWSERSTATIC_PATH}
      - DARWIN_BROWSERMEDIA_PATH=${DARWIN_BROWSERMEDIA_PATH}
      - DARWIN_BROWSERDOWNLOAD_PATH=${DARWIN_BROWSERDOWNLOAD_PATH}
      - NGINX_SNIPPET_PATH=${NGINX_SNIPPET_PATH:-/etc/nginx/snippets}
      - NGINX_LOG_TO_FILE=${NGINX_LOG_TO_FILE:-false}
      - REVERSE_PROXY_IP=${REVERSE_PROXY_IP:-}
      # USER_AGENT_BOT_FILE and SUBNET_BOT_FILE are relative to NGINX_SNIPPET_PATH_HOST
      # they can be used to block known crawlers/crawlers coming from known subnets
      # an example of both files is provided in ./nginx/snippets/*.conf.template
      - USER_AGENT_BOT_FILE=${USER_AGENT_BOT_FILE:-}
      - SUBNET_BOT_FILE=${SUBNET_BOT_FILE:-}
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${OAUTH2_PROXY_OIDC_ISSUER_URL}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
    depends_on:
      - web
      - oauth2-proxy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  # if release data is used with a docker volume, uncomment release_volume line and
  # set RELEASE_PATH_HOST="release_volume" in env file
  #release_volume:


secrets:
  labgit:
    file: "./labgit.cnf"
  TOKEN:
    file: "./token"
