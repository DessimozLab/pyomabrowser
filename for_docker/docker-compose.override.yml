services:
  # Vite dev server for Vue hot-reload
  vite:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules # Anonymous volume to avoid overwriting node_modules
    environment:
      - NODE_ENV=development

  web:
    volumes:
      - ..:/usr/src/pyomabrowser # mount your local checkout for live code reload
    environment:
      - DJANGO_VITE_DEV_MODE=true
      # Use 'localhost' not 'vite' - the browser needs to access http://localhost:5173
      - DJANGO_VITE_DEV_SERVER_HOST=localhost
      - DJANGO_VITE_DEV_SERVER_PORT=5173
    # Skip production entrypoint, run Django dev server directly
    #  django dev server often gets killed, so we do not encourage using it
    #  unless you want to test something that needs the dev server (e.g. live reload of templates)
    #  uncomment the following lines to use it, but be aware that it may cause issues with the container getting killed
    #  and you will need to access the dev server on http://localhost:8000 instead of http://localhost
    #entrypoint: []
    #command: >
    # sh -c "python manage.py migrate --noinput &&
    #        python manage.py runserver 0.0.0.0:8000"
    #ports:
    # - "8000:8000"
    depends_on:
      - vite

  worker:
    command:
      [
        "celery",
        "--app=pybrowser_dev.celery_app",
        "worker",
        "--concurrency=1",
        "--queues=celery,async_web",
        "--hostname=worker@%h",
        "--loglevel=DEBUG",
      ]
    volumes:
      - ..:/usr/src/pyomabrowser

  worker_long:
    command:
      [
        "celery",
        "--app=pybrowser_dev.celery_app",
        "worker",
        "--concurrency=1",
        "--queues=celery,async_web,long",
        "--hostname=worker@%h",
        "--loglevel=DEBUG",
      ]
    volumes:
      - ..:/usr/src/pyomabrowser
