services:
  # Vite dev server for Vue hot-reload
  vite:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules # Anonymous volume to avoid overwriting node_modules
    environment:
      - NODE_ENV=development

  web:
    volumes:
      - ..:/usr/src/pyomabrowser # mount your local checkout for live code reload
    environment:
      - DJANGO_VITE_DEV_MODE=true
      - DJANGO_VITE_DEV_SERVER_HOST=vite
      - DJANGO_VITE_DEV_SERVER_PORT=5173
    # Skip production entrypoint, run Django dev server directly
    entrypoint: []
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - vite

  worker:
    command:
      [
        "celery",
        "--app=pybrowser_dev.celery_app",
        "worker",
        "--concurrency=1",
        "--queues=celery,async_web",
        "--hostname=worker@%h",
        "--loglevel=DEBUG",
      ]
    volumes:
      - ..:/usr/src/pyomabrowser

  worker_long:
    command:
      [
        "celery",
        "--app=pybrowser_dev.celery_app",
        "worker",
        "--concurrency=1",
        "--queues=celery,async_web,long",
        "--hostname=worker@%h",
        "--loglevel=DEBUG",
      ]
    volumes:
      - ..:/usr/src/pyomabrowser
