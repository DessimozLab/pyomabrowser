[project]
name = "pyomabrowser"
version = "0.1.0"
description = "OMA Browser - Django webserver package"
readme = "Readme.md"
authors = [
    { name = "Adrian Altenhoff", email = "adrian.altenhoff@sib.swiss" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery>=5.5.3",
    "drf-spectacular[sidecar]>=0.27",
    "django>=5.2.8",
    "django-bootstrap4>=25.2",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=6.1.0",
    "django-matomo-api-tracking>=0.2.0",
    "django-recaptcha>=4.1.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-csv>=3.0.2",
    "djangorestframework-link-header-pagination >=0.1.1",
    "markdown>=3.10",
    "numpy>=1.26",
    "oma-academy-app",
    "omamer>=2.0.3",
    "pyham>=1.2.0",
    "pyoma[enrichment]",
    "pyyaml>=6.0.3",
    "sentry-sdk[django]>=2.44.0",
    "tables>=3.10.2",
    "zoo",
    "django-vite>=3.0.4",
    "tables<3.11",    # 3.11.1 crashes after migrations
]

[dependency-groups]
production = [
    "psycopg[binary]>=3.2.12",
    "uwsgi; sys_platform != 'darwin'",
]
downloads = [
    "b2sdk",
]

[tool.uv.sources]
pyoma = { git = "ssh://gitolite@lab.dessimoz.org:2222/pyoma", branch = "develop" }
zoo = { git = "ssh://gitolite@lab.dessimoz.org:2222/zoo" }
oma-academy-app = { git = "ssh://gitolite@lab.dessimoz.org:2222/oma-academy" }
