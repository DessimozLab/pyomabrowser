# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Docker.gitlab-ci.yml

# Build a Docker image with CI/CD and push to the GitLab registry.
# Docker-in-Docker documentation: https://docs.gitlab.com/ci/docker/using_docker_build/
#
# This template uses one generic job with conditional builds
# for the default branch and all other (MR) branches.

docker-build:
  # Use the official docker image.
  image: docker:cli
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: 1
    IMAGE_TAG: $CI_COMMIT_REF_SLUG
    DOCKER_REGISTRY: $CI_REGISTRY_IMAGE
    
    RELEASE_PATH: /data/release
    DARWIN_BROWSERSTATIC_PATH: /data/static
    DARWIN_BROWSERMEDIA_PATH: /data/media
    DARWIN_BROWSERDATA_PATH: /data/release/data
    DARWIN_BROWSERDOWNLOAD_PATH: /data/release/downloads
    DARWIN_ALLALL_PATH: /data/release/AllAll
    ALLALL_PATH_HOST: $CI_PROJECT_DIR/
    RELEASE_PATH_HOST: $CI_PROJECT_DIR/
    DEPLOYMENT_TYPE: production
    # DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - echo $LABGIT_URL > for_docker/labgit.cnf
    - echo "" > for_docker/env
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  # All branches are tagged with $DOCKER_IMAGE_NAME (defaults to commit ref slug)
  # Default branch is also tagged with `latest`
  script:
    - env
    - docker compose -f for_docker/docker-compose.yml config
    - docker compose -f for_docker/docker-compose.yml build
    - docker compose -f for_docker/docker-compose.yml push
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        echo "tagging image as 'latest'"
        docker tag "$CI_REGISTRY_IMAGE/oma:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/oma:latest"
        docker tag "$CI_REGISTRY_IMAGE/nginx:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/nginx:latest"
        docker push "$CI_REGISTRY_IMAGE/oma:latest"
        docker push "$CI_REGISTRY_IMAGE/nginx:latest"
      fi
  # Run this job in a branch where a Dockerfile exists
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - for_docker/oma/Dockerfile
