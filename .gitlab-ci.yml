# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Docker.gitlab-ci.yml

# Build a Docker image with CI/CD and push to the GitLab registry.
# Docker-in-Docker documentation: https://docs.gitlab.com/ci/docker/using_docker_build/
#
# This template uses one generic job with conditional builds
# for the default branch and all other (MR) branches.


# temprary fix for DNS issues
.dns_fix: &dns_fix
  - |
    # temporary workaround for DNS issues
    sed 's/nameserver 10\.96\.0\.10/nameserver 10.0.91.1/' /etc/resolv.conf > /tmp/resolv.conf.new
    cat /tmp/resolv.conf.new > /etc/resolv.conf
    cat /etc/resolv.conf

stages:
  - frontend
  - build
  - deploy

frontend-build:
  stage: frontend
  image: node:24-alpine
  before_script:
    - *dns_fix
  script:
    - cd frontend
    - npm ci --verbose
    - npm run build
  artifacts:
    paths:
      - oma/static/vite/
    expire_in: 1 hour
  # Run this job only if there are changes in the frontend directory
  # rules:
  #   - if: $CI_COMMIT_BRANCH
  #     changes:
  #       - frontend/**/*

docker-build:
  # Use the official docker image.
  image: docker:cli
  stage: build
  needs:
    - frontend-build
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: 1
    IMAGE_TAG: $CI_COMMIT_REF_SLUG
    DOCKER_REGISTRY: $CI_REGISTRY_IMAGE

    RELEASE_PATH: /data/release
    DARWIN_BROWSERSTATIC_PATH: /data/static
    DARWIN_BROWSERMEDIA_PATH: /data/media
    DARWIN_BROWSERDATA_PATH: /data/release/data
    DARWIN_BROWSERDOWNLOAD_PATH: /data/release/downloads
    DARWIN_ALLALL_PATH: /data/release/AllAll
    ALLALL_PATH_HOST: $CI_PROJECT_DIR/
    RELEASE_PATH_HOST: $CI_PROJECT_DIR/
    DEPLOYMENT_TYPE: production
    # DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - *dns_fix
    - apk add --no-cache jq
    - echo $LABGIT_URL > for_docker/labgit.cnf
    - echo "" > for_docker/env
    - |
      if [ -n "$DOCKER_AUTH_CONFIG" ]; then
        mkdir -p /root/.docker
        [ -f /root/.docker/config.json ] || echo '{}' > /root/.docker/config.json
        echo "$DOCKER_AUTH_CONFIG" | jq -s '.[0] * .[1]' /root/.docker/config.json - > /root/.docker/config.json.tmp
        mv /root/.docker/config.json.tmp /root/.docker/config.json
      fi
    # CI_JOB_TOKEN created automatcally by job itself: https://docs.gitlab.com/ci/jobs/ci_job_token/
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  # All branches are tagged with $DOCKER_IMAGE_NAME (defaults to commit ref slug)
  # Default branch is also tagged with `latest`
  script:
    - |
      ls -la oma/static/vite/ || echo "Warning: vite artifacts not found"
      mkdir -p for_docker/oma/static/vite
      cp -r oma/static/vite/* for_docker/oma/static/vite/ || echo "No vite files to copy"
    - docker compose -f for_docker/docker-compose.yml build
    - docker compose -f for_docker/docker-compose.yml push
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        echo "tagging image as 'latest'"
        docker tag "$CI_REGISTRY_IMAGE/oma:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/oma:latest"
        docker tag "$CI_REGISTRY_IMAGE/nginx:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/nginx:latest"
        docker push "$CI_REGISTRY_IMAGE/oma:latest"
        docker push "$CI_REGISTRY_IMAGE/nginx:latest"
      fi
  # Run this job in a branch where a Dockerfile exists
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - for_docker/oma/Dockerfile

deploy_stage:
  stage: deploy
  image: docker:latest
  environment:
    name: stage
    url: https://oma-stage.vital-it.ch
  only:
    - master
  variables:
    STAGE_HOST: oma-stage8.vital-it.ch
    USER: oma
  before_script:
    - *dns_fix
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H ${STAGE_HOST} >> ~/.ssh/known_hosts
  script:
    - |
      ssh ${USER}@${STAGE_HOST} << 'EOF'
        cd pyomabrowser/for_docker
        git fetch --all
        git reset --hard origin/master
        echo "$CI_JOB_TOKEN" | podman login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
        podman compose pull
        systemctl --user restart podman-compose@pyoma.service
      EOF
