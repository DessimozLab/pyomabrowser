{% extends  "base_genome.html" %}


{% block title %}Chromosome viewer of genome {{genome.uniprot_species_code}}{% endblock %}


{% block js_hook %}

<!-- Load css from static -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chromosome-viewer@1.1.22/dist/GenomeViewer.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <script type="module" src="https://cdn.jsdelivr.net/npm/chromosome-viewer@1.1.22/dist/GenomeViewer.umd.js"></script>

{% endblock js_hook %}


{% block contentTab %}

    <style>
    a {
        text-decoration: none !important;
    }
    </style>

    <div id="app" style="width: 100%;"></div>

    <script >
    const settings = {
        'type_chromosome': 'extant',
        'remove_outliers_legend': ['age'],
        'sorting_chromosome': 'size',
        'min_genes': 20,
        'level': '{{genome_name}}',
        'oma': true,
        'callback_click_synteny': function (data) {
            let newUrl="{% url 'synteny' 1234567  %}".replace(/1234567/,data);
            window.open(newUrl, "_blank");
        },
        'callback_click_detail': function (data) {
            let newUrl="{% url 'pairs' 1234567  %}".replace(/1234567/,data);
            window.open(newUrl, "_blank");
        },
    };

    fetch("/api/synteny/?format=json&level={{genome.uniprot_species_code}}")
      .then(response => response.json())
      .then(data => {
        const app = Vue.createApp(GenomeViewer, {jsonData: data, user_settings: settings});
        const vm = app.mount('#app');

        // Access the root component instance and call methods or update state
        vm.$refs.chromosomeViewer.forEach(chromosome => {
            if (chromosome && typeof chromosome.render_excerpt === 'function') {
                chromosome.render_excerpt();
            }
        });
      });
  </script>



{% endblock contentTab %}
